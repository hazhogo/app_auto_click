name: Build Android APK

on:
push:
branches: [ "main" ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Locate Android SDK
    shell: bash
    run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

      if [ -z "$SDKMANAGER" ]; then
        echo "ERROR: sdkmanager not found"
        exit 1
      fi

      echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

  - name: Install Android SDK packages
    shell: bash
    run: |
      yes | "$SDKMANAGER" --licenses || true
      "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

  - name: Build APK
    working-directory: android
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: zhogo-turn-debug-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk